language: scala

scala:
  - "2.13.16"

jdk:
  - openjdk17

# These directories are cached to S3 at the end of the build
cache:
  directories:
    - $HOME/.ivy2/cache
    - $HOME/.sbt/boot/

script:
  - sbt -sbt-version 1.9.9 -scala-version $TRAVIS_SCALA_VERSION clean coverage test

after_success:
  - sbt coverageReport coveralls
